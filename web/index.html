<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>共通ロビー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root{
  --bg:#f1f4f2;--ink:#16282b;--sub:#5d7074;--line:#cfd9d6;--paper:#fff;
  --wait:#14795f;--play:#b4651a;--idle:#4a6f8a;--off:#8a9799;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11191b;--ink:#e6efed;--sub:#96a9ad;--line:#2a3b3e;--paper:#172326;
    --wait:#4fc29c;--play:#e39a52;--idle:#7fa6c2;--off:#6f7f82;
  }
}
:root[data-theme="dark"]{
  --bg:#11191b;--ink:#e6efed;--sub:#96a9ad;--line:#2a3b3e;--paper:#172326;
  --wait:#4fc29c;--play:#e39a52;--idle:#7fa6c2;--off:#6f7f82;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:.02em}
.sum{margin:0 0 20px;color:var(--sub);font-size:.95rem}
.sum b{color:var(--ink)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{display:grid;grid-template-columns:7px 1fr auto;align-items:center;gap:14px;
  background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;padding-right:14px}
.stripe{align-self:stretch;background:var(--c)}
.row.waiting{--c:var(--wait)}.row.playing{--c:var(--play)}
.row.idle{--c:var(--idle)}.row.off{--c:var(--off);border-style:dashed}
.row.off .name{color:var(--sub)}
.main{padding:12px 0}
.name{font-size:1.15rem;font-weight:700;margin:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:4px;font-size:.85rem;color:var(--sub)}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--c);font-weight:700;font-size:.9rem}
.chip:focus-visible,.go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dot{width:10px;height:10px;display:inline-block;border:2px solid var(--c)}
.waiting .dot{background:var(--c);border-radius:50%}
.idle .dot{border-radius:50%}
.playing .dot{background:var(--c);border-radius:2px}
.off .dot{height:0;border-width:0 0 2px;width:12px}
.ver{font-variant-numeric:tabular-nums;font-size:.8rem}
.old{border:1px solid var(--play);color:var(--play);border-radius:4px;padding:0 6px;font-size:.75rem}
.go{all:unset;cursor:pointer;text-align:center;min-width:5.6em;padding:9px 14px;border-radius:6px;
  font-weight:700;font-size:.95rem;background:var(--c);color:var(--paper)}
.row.off .go{background:transparent;color:var(--off);border:1px solid var(--line);cursor:default}
.note{margin-top:22px;font-size:.8rem;color:var(--sub)}
</style>
</head>
<body>
<main>
  <h1>ゲームロビー</h1>
  <p class="sum" id="sum"></p>
  <ul id="list"></ul>
  <p class="note" id="note"></p>
</main>
<script>
var LABEL={idle:"アイドル",waiting:"開始待ち",playing:"プレイ中",off:"停止中"};
var ORDER={waiting:0,idle:1,playing:2,off:3};
var servers=[];

function fmtUpdated(iso){
  if(!iso) return "";
  var d=new Date(iso);
  if(isNaN(d.getTime())) return "";
  function p(n){return (n<10?"0":"")+n;}
  return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}

var noteEl=document.getElementById("note");
function setNote(text, iso){
  noteEl.textContent="";
  if(text) noteEl.appendChild(document.createTextNode(text));
  noteEl.appendChild(document.createTextNode("最終更新 "));
  var ts=document.createElement("span");
  ts.id="ts";
  ts.textContent=fmtUpdated(iso);
  noteEl.appendChild(ts);
}
setNote("", null);

function render(){
  var rows=servers.slice().sort(function(a,b){return ORDER[a.status]-ORDER[b.status];});
  var n={waiting:0,playing:0,off:0};
  servers.forEach(function(s){if(n[s.status]!==undefined)n[s.status]++;});
  document.getElementById("sum").innerHTML="入れる部屋 <b>"+n.waiting+"</b>　プレイ中 <b>"+n.playing+"</b>　停止 <b>"+n.off+"</b>";
  var ul=document.getElementById("list");
  ul.innerHTML="";
  rows.forEach(function(s){
    var li=document.createElement("li");
    li.className="row "+s.status;
    li.innerHTML='<div class="stripe"></div><div class="main"><h2 class="name"></h2><div class="meta"></div></div>';
    if(s.status==="off"){
      var go=document.createElement("span");
      go.className="go";
      go.textContent="停止中";
      li.appendChild(go);
    }else{
      var a=document.createElement("a");
      a.className="go";
      a.href=s.url;
      a.textContent=s.status==="playing"?"観戦する":"入る";
      li.appendChild(a);
    }
    var main=li.querySelector(".main");
    var nameEl=main.querySelector(".name");
    nameEl.textContent=s.name||s.game||"";
    var meta=main.querySelector(".meta");
    var chip=document.createElement("span");
    chip.className="chip";
    var dot=document.createElement("span");
    dot.className="dot";
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(LABEL[s.status]));
    meta.appendChild(chip);
    if(s.version){
      var ver=document.createElement("span");
      ver.className="ver";
      ver.textContent=s.version;
      meta.appendChild(ver);
    }
    if(s.stale){
      var old=document.createElement("span");
      old.className="old";
      old.textContent="更新待ち";
      meta.appendChild(old);
    }
    ul.appendChild(li);
  });
}

function refresh(){
  return fetch("/api/servers").then(function(res){
    if(!res.ok) throw new Error("http "+res.status);
    return res.json();
  }).then(function(data){
    if(data && data.updated===null){
      servers=[];
      setNote("読み込み中", null);
    }else{
      servers=data.servers||[];
      setNote("", data.updated);
    }
    render();
  }).catch(function(){
    setNote("ロビーに接続できません", null);
  });
}

refresh();
var timer=null;
function startTimer(){
  timer=setInterval(function(){ if(document.visibilityState==="visible") refresh(); },5000);
}
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"){
    clearInterval(timer);
    refresh();
  }
});
startTimer();
</script>
</body>
</html>
